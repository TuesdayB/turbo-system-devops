    }

    .message {
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
    }

    .success {
      background: #d4edda;

    }

    .error {
      background: #f8d7da;
      color: #721c24;

    }

    .record {

    }

      max-height: 400px;

<body>
  <!-- I need to figure out how to make a more intuitive way to input arrays of coordinate points for the quilt geometry. 
   Each small array would be a polygon. 
   I have the API key, I just need to make sure it isn't visible to the public. Or at least I'm pretty sure it shouldn't be visible to the public.-->
  <!-- Quilt Form -->
  <div class="container-lg">
    <h2>Make a Quilt</h2>
    <div id="message"></div>

    <form id="quiltForm">
      <div class="form-group">
        <label for="quiltName">Quilt Name:</label>
        <input type="text" id="quiltName" required>
      </div>

      <div class="form-group">
        <label for="quiltWidth">Quilt Width (in squares):</label>
        <input type="number" id="quiltWidth" required min="2" max="10">
      </div>

      <div class="form-group">
        <label for="quiltHeight">Quilt Height (in squares):</label>
        <input type="number" id="quiltHeight" required min="2" max="10">
      </div>

      <div class="form-group">
        <label for="squareSize">Square Size (in inches):</label>
        <input type="number" id="squareSize" required min="5" max="10">
      </div>

      <button type="submit">Save Quilt</button>
      <button type="button" onclick="loadQuilts()">Refresh List</button>
    </form>
    <br>
    <p>Support for pattern planning coming soon!</p>
  </div>
<!-- Pattern Planner  -->
 <!-- I need to figure out how to make a more intuitive way to input arrays of coordinate points for the quilt geometry. 
   Each small array would be a polygon. 
   Unsure whether the API key should be publicly visible or not, but the Desmos site doesn't seem concerned about that in its instructions.-->
 <div class="container-lg">
<p><strong>Work in Progress!</strong></p>
  <div id="calculator" style="width: 600px; height: 400px;"></div>
 </div>

  <!-- Quilt Records -->
  <div class="container-lg">
    <h2>Quilts</h2>
    <div id="quiltList">Loading quilt records...</div>
  </div>

  <!-- footer -->
  <!-- source: Blog-Admin index.html footer pattern -->
  <footer>
    <div class="footer d-flex bg-purple justify-content-center align-items-center gap-3">
      <span>Tuesday Brown</span>
      <a target="_blank" href="https://github.com/TuesdayB/turbo-system-devops">GitHub</a>
      <a target="_blank"
        href="https://validator.w3.org/nu/?doc=https%3A%2F%2Fquiltmachine.barrycumbie.com%2F">Validator</a>
      <a target="_blank" href="https://turbo-system-devops.onrender.com/">Render</a>
    </div>
  </footer>

  <script>
    let editingId = null;

    // Handle form submission
    document.getElementById('quiltForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const quiltName = document.getElementById('quiltName').value;
      const quiltWidth = document.getElementById('quiltWidth').value;
      const quiltHeight = document.getElementById('quiltHeight').value;
      const squareSize = document.getElementById('squareSize').value;

      try {
        const url = editingId ? `/api/quilts/${editingId}` : '/api/quilts';
        const method = editingId ? 'PUT' : 'POST';

        const response = await fetch(url, {
          method: method,
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            quiltName,
            quiltWidth,
            quiltHeight,
            squareSize
          })
        });

        const result = await response.json();

        if (response.ok) {
          showMessage(result.message, 'success');
          document.getElementById('quiltForm').reset();
          if (editingId) {
            editingId = null;
            document.querySelector('button[type="submit"]').textContent = 'Save Quilt';
          }
          loadQuilts();
        } else {
          showMessage(result.error, 'error');
        }
      } catch (error) {
        showMessage('Error submitting form', 'error');
      }
    });

    // Load quilt records
    async function loadQuilts() {
      try {
        const response = await fetch('/api/quilts');
        const records = await response.json();

        const listDiv = document.getElementById('quiltList');

        if (records.length === 0) {
          listDiv.innerHTML = '<p>No quilt records yet.</p>';
          return;
        }

        listDiv.innerHTML = records.map(record => `
          <div class="record">
            <strong>${record.quiltName}</strong><br>
            <small>Dimensions: ${record.quiltWidth} x ${record.quiltHeight} | Recorded: ${new Date(record.timestamp).toLocaleString()}</small><br>
            <button class="edit-btn" onclick="editRecord('${record._id}', '${record.quiltName}', '${record.quiltWidth}', '${record.quiltHeight}','${record.squareSize}')">Edit</button>
            <button class="delete-btn" onclick="deleteRecord('${record._id}')">Delete</button>
          </div>
        `).join('');
      } catch (error) {
        document.getElementById('quiltList').innerHTML = 'Error loading quilt records';
      }
    }

    // Edit record
    function editRecord(id, quiltName, quiltWidth, quiltHeight, squareSize) {
      editingId = id;
      document.getElementById('quiltName').value = quiltName;
      document.getElementById('quiltWidth').value = quiltWidth;
      document.getElementById('quiltHeight').value = quiltHeight;
      document.getElementById('squareSize').value = squareSize;
      document.querySelector('button[type="submit"]').textContent = 'Update Quilt';
      showMessage('Editing record - click Update to save changes', 'success');
    }

    // Delete record
    async function deleteRecord(id) {
      if (!confirm('Are you sure you want to delete this record?')) return;

      try {
        const response = await fetch(`/api/quilts/${id}`, {
          method: 'DELETE'
        });

        const result = await response.json();

        if (response.ok) {
          showMessage(result.message, 'success');
          loadQuilts();
        } else {
          showMessage(result.error, 'error');
        }
      } catch (error) {
        showMessage('Error deleting record', 'error');
      }
    }

    // Show message
    function showMessage(text, type) {
      const messageDiv = document.getElementById('message');
      messageDiv.innerHTML = `<div class="message ${type}">${text}</div>`;
      setTimeout(() => {
        messageDiv.innerHTML = '';
      }, 3000);
    }

    // Initialize page
    loadDesmosInfo();
    loadQuilts();

    // Set today's date as default
    document.getElementById('date').value = 'February 30, 2026';
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"

  </script>
</body>
