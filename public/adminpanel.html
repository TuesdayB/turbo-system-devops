<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comic - Space Station 76</title>
  <link rel="icon"
    href="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fupload.wikimedia.org%2Fwikipedia%2Fcommons%2Fthumb%2F8%2F80%2FIcon_planet.svg%2F2048px-Icon_planet.svg.png&f=1&nofb=1&ipt=98ae3b60ed94fc2cc298f14918003edcc2e6f95f07652aa0cb40a14e7e099375">
  <link rel="stylesheet" href="https://unpkg.com/normalize.css@8.0.1/normalize.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" type="text/css" href="/Styles/style.css">
</head>

<body>
  <div id="Navbar">
    <!-- Nav bar - source code: https://getbootstrap.com/docs/5.3/components/navbar/ -->
  </div>

  <div class="container-lg">
    <p>Admin Panel</p>
    <div id="message"></div>
    <button id="editComics">Post/Edit Comic Pages</button>
    <button id="editAnnouncements">Post/Edit Announcements</button>
  </div>

  <div class="row align-items-start">
    <div class="col">
      <div class="container-lg" id="comicFormDiv">
        <form id="comicPageEditor">
          <div class="form-group">
            <label for="pageTitle">Page Title:</label>
            <input type="text" id="pageTitle">
          </div>
          <div class="form-group">
            <label for="pageIndex">Page Index:</label>
            <input type="number" id="pageIndex" min="1">
          </div>
          <div class="form-group">
            <label for="pageLink">Page Link:</label>
            <input type="text" id="pageLink">
          </div>
          <button type="submit" id="comicPageSubmission">Publish Page</button>
        </form>
      </div>
    </div>
    <div class="col">
      <div class="container-lg" id="comicPageList">

      </div>
    </div>
  </div>

  <div class="row align-items-start">
    <div class="col">
      <div class="container-lg" id="announcementFormDiv">
        <form id="announcementEditor">
          <div class="form-group">
            <label for="announcementTitle">Announcement Title:</label>
            <input type="text" id="announcementTitle">
          </div>
          <div class="form-group">
            <label for="announcementBody">Announcement Body:</label>
            <textarea id="announcementBody" rows="10" cols="40"></textarea>
          </div>
          <button type="submit" id="announcementSubmission">Publish Announcement</button>
        </form>
      </div>
    </div>
    <div class="col">
            <div class="container-lg" id="announcementList">

      </div>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="Scripts/script.js" type="application/javascript"></script>
  <script src="Scripts/adminpanel.js" type="application/javascript"></script>
</body>

</html>
